services:
  - type: web
    name: snowflake-sql-bridge
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SQL_SERVER
        sync: false
      - key: SQL_DATABASE
        sync: false
      - key: SQL_USERNAME
        sync: false
      - key: SQL_PASSWORD
        sync: false
      - key: API_TOKEN
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
