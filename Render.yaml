services:
  - type: web
    name: snowflake-sql-bridge
    env: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: SQL_SERVER
        sync: false
      - key: SQL_DATABASE
        sync: false
      - key: SQL_USERNAME
        sync: false
      - key: SQL_PASSWORD
        sync: false
      - key: API_TOKEN
        generateValue: true
